name: Planlagt publisering

# Kaller /api/cron/publish jevnlig, siden Vercel Hobby bare tillater daglig cron.
# Endepunktet publiserer KUN innlegg eieren har godkjent og planlagt, og kontrollerer
# godkjenningen på nytt. Krever repository-secrets APP_URL og CRON_SECRET.
# Merk: GitHub kan forsinke planlagte kjøringer med noen minutter ved høy last.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Kall publiseringsendepunktet
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL eller CRON_SECRET mangler i repository-secrets – hopper over."
            exit 0
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/publish")
          echo "HTTP $status"
          # Viser kun status, modus og antall – eller feilmeldingen (aldri hemmeligheter).
          python3 - <<'PY' || head -c 500 response.json
          import json
          d = json.load(open("response.json"))
          if "error" in d:
              print("Feil:", d["error"])
              if d.get("missing"):
                  print("Mangler/ugyldig i Vercel:", ", ".join(d["missing"]))
          else:
              print("modus:", d.get("mode"), "| behandlet:", d.get("processed"))
          PY
          test "$status" = "200"
